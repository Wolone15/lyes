<!doctype html><html lang="fr"><meta charset="utf-8"><title>LYES · vérification audio</title><style>body{font:16px Segoe UI;background:#111732;color:#eee;padding:35px}button{padding:14px;border-radius:12px;font:inherit}pre{white-space:pre-wrap;line-height:1.8}</style><h1>Vérification du rendu audio</h1><p>Ce diagnostic produit un signal synthétique en mémoire. Il ne lit aucun microphone.</p><button id="run">Vérifier le son et un morceau de trois minutes</button><pre id="result" role="status"></pre><script type="module">
import {AudioEngine,wav} from '../src/engine.js';import {compose} from '../src/model.js';import {parseBrief,buildComposition} from '../src/composer.js';import {analyzeBuffer} from '../src/references.js';
const out=document.querySelector('#result');const log=t=>out.textContent+='\n'+t;
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;try{log('Début du test natif');const start=performance.now(),ctx=new OfflineAudioContext(1,44100,44100),o=ctx.createOscillator();o.connect(ctx.destination);o.start(0);o.stop(.5);const bare=await ctx.startRendering();log('OK · Signal natif, '+Math.round(performance.now()-start)+' ms');const engine=new AudioEngine();let last='';setInterval(()=>{const state=engine.renderStatus+' · '+(engine.offlineContext?.state||'')+' · '+(engine.offlineContext?.currentTime||0);if(state!==last){last=state;log(state);}},1000);log('Début du test multipiste court');const short=await engine.render(compose({bars:4}));log('OK · Rendu multipiste : '+short.duration.toFixed(1)+' secondes');log('Début du test trois minutes');const p=buildComposition(parseBrief('Crée une production de 3 minutes, piano guitare basse batterie'));const long=await engine.render(p,null,{onProgress:p=>log('Avancement réel : '+Math.round(p*100)+' %')});log('OK · Rendu long : '+long.duration.toFixed(1)+' secondes');let peak=0;for(const n of long.getChannelData(0))peak=Math.max(peak,Math.abs(n));log('Crête : '+peak);const bytes=wav(long);log('WAV : '+bytes.byteLength+' octets');const analysis=await analyzeBuffer(short,{seconds:5});log('OK · Analyse par worker : '+analysis.analyzedSeconds+' secondes');await engine.ctx.close();log('TERMINÉ');}catch(e){log('ÉCHEC : '+e.message);}finally{document.querySelector('#run').disabled=false;}};
</script></html>
